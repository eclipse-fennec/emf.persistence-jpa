name: Mongo Flavor Matrix

# The only place the mongo backend is measured against a real server (issues #121, #132).
#
# MongoDB itself is in the matrix because the default build never contacts a server either:
# build.yml has no Mongo service, so without a job here the reference implementation is
# verified nowhere and its whole suite skips itself green (issue #132). It is also the
# baseline the gateway results are only meaningful against — "ferretdb refuses this" says
# nothing unless mongo accepts it.
#
# For the gateways there is a second purpose: the per-flavor capability declarations in
# MongoFlavorCapabilities are claims about a server nothing else contacts. Claims nothing
# checks go stale — and staleness is silent in both directions:
#   * a feature the server has lost still declared -> users hit a driver error
#   * a gap the server has since closed still declared -> validate() refuses queries the
#     server would happily serve, and nothing fails, so nobody notices
#
# Two modes on purpose:
#   * push / pull_request run against a DIGEST-PINNED image, so a PR is never reddened by an
#     upstream gateway release it has nothing to do with
#   * the weekly schedule runs against the floating tag, which is what actually discovers
#     drift — a pin alone would only ever reveal it when somebody bumps the pin

on:
  push:
    branches-ignore:
      - main
      - snapshot
    paths:
      - 'org.eclipse.fennec.persistence.mongo/**'
      - 'org.eclipse.fennec.persistence.query/**'
      - 'org.eclipse.fennec.persistence.tck/**'
      - '.github/workflows/mongo-flavors.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'org.eclipse.fennec.persistence.mongo/**'
      - 'org.eclipse.fennec.persistence.query/**'
      - 'org.eclipse.fennec.persistence.tck/**'
      - '.github/workflows/mongo-flavors.yml'
  schedule:
    # Mondays 04:17 UTC — off the hour to avoid the scheduling stampede
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mongo-flavors-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  flavor-tck:
    name: TCK against ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      # one flavor must not cancel the other: knowing that ferretdb broke while mongo is
      # fine is the whole point
      fail-fast: false
      matrix:
        flavor: [mongo, ferretdb, documentdb-pg]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: 21

      - name: Select the server image
        id: image
        run: |
          # scheduled and manual runs float, so upstream drift is actually discovered;
          # PR/push runs pin by digest so they stay reproducible
          case "${{ matrix.flavor }}" in
            mongo)
              floating='docker.io/library/mongo:7'
              pinned='docker.io/library/mongo@sha256:be3d6353f3ea3fd3d22e016d19da20fcd6937eda0739eb6d2aeed335baa60f90'
              ;;
            ferretdb)
              floating='ghcr.io/ferretdb/ferretdb-eval:2'
              pinned='ghcr.io/ferretdb/ferretdb-eval@sha256:1bf47a449dd65839aabfc1a535d1370c98326f8a90de20437eda0aeb30bd8dd5'
              ;;
            documentdb-pg)
              floating='ghcr.io/microsoft/documentdb/documentdb-local:latest'
              pinned='ghcr.io/microsoft/documentdb/documentdb-local@sha256:2dd1f8875e59b77a679dac82c1b3e7b2179f920db702515f006a82397d9e3b13'
              ;;
            *)
              echo "::error::no image configured for flavor ${{ matrix.flavor }}"; exit 1 ;;
          esac
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "image=$floating" >> "$GITHUB_OUTPUT"
            echo "mode=floating" >> "$GITHUB_OUTPUT"
          else
            echo "image=$pinned" >> "$GITHUB_OUTPUT"
            echo "mode=pinned" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the persistence TCK against ${{ matrix.flavor }}
        # The TCK is the drift detector: every capability the flavor declares has to execute,
        # and every one it does not declare has to be refused with a Diagnostic. A green run
        # means declaration and server still agree.
        run: |
          echo "::notice::Running the ${{ matrix.flavor }} TCK against ${{ steps.image.outputs.image }} (${{ steps.image.outputs.mode }})"
          ./gradlew :org.eclipse.fennec.persistence.tck:test \
            --tests 'org.eclipse.fennec.persistence.tck.Mongo*' \
            -Dmongo.test.flavor=${{ matrix.flavor }} \
            -Dmongo.test.image=${{ steps.image.outputs.image }} \
            -Dmongo.container.cli=docker \
            -Dmongo.require=true \
            --console=plain

      - name: Verify the suite actually ran
        # -Dmongo.require=true above already turns an unreachable server into a failure, so
        # this is the belt to that braces: it also catches a suite that executed nothing for
        # a reason the harness cannot see (a bad --tests filter, a compile-time exclusion).
        # A green build must never mean "measured exactly nothing".
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = skipped = 0
          for f in glob.glob("org.eclipse.fennec.persistence.tck/generated/test-reports/test/TEST-*Mongo*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests")); skipped += int(r.get("skipped") or 0)
          executed = total - skipped
          print(f"tests={total} skipped={skipped} executed={executed}")
          if executed == 0:
              print("::error::the ${{ matrix.flavor }} suite executed 0 tests — the server was unreachable, so nothing was verified")
              sys.exit(1)
          PY

      - name: Upload test report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tck-report-${{ matrix.flavor }}
          path: org.eclipse.fennec.persistence.tck/generated/test-reports/
          if-no-files-found: warn
