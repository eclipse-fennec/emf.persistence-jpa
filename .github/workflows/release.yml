name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release step gets its secrets via
# `secrets: inherit` below (verify + docs never see them).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      # See build.yml: parallel Gradle plus the chatty EMF generator produces sporadic
      # "Stream closed" failures (issue #192) — least acceptable on a release run.
      gradle-parallel: false

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      do-release: true
      # The same #192 mitigation as verify above: this job runs the EMF generator too,
      # and it is the one that actually publishes. A "Stream closed" here costs the
      # release.
      gradle-parallel: false
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
