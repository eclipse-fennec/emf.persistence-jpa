plugins {
  id "org.sonarqube" version "6.3.1.5724"
  id 'jacoco'
  id 'java'
}

// We need to define a repository for the root project, otherwise Jacoco dependencies cannot be resolved
repositories {
  mavenCentral()
}

subprojects {

    //  Apply plugin: 'jacoco' to all submodules JUnit tests are generated as generated/jacoco/test.exec
    apply plugin: 'jacoco'
    apply plugin: 'java'
    // We need to define a repository, otherwise Jacoco dependencies cannot be resolved
    repositories {
        mavenCentral()
    }
    // Properties that select the backend and flavor a test suite runs against — the two axes of
    // issue #134. Gradle does not forward -D from its own JVM to the test JVM, so they are passed
    // through explicitly: without this, -Dmongo.test.flavor=ferretdb would silently test MongoDB
    // instead (issue #119), and -Djpa.test.flavor=postgres would silently test H2. A flavor that
    // is asked for and quietly not used is the worst outcome of the matrix, because the run is
    // green and measures the wrong thing — so a new axis property must be added here too.
    def backendSelectionProperties = ['mongo.uri', 'mongo.test.image', 'mongo.test.flavor',
                                      'mongo.container.cli', 'mongo.require',
                                      'jpa.jdbc.url', 'jpa.test.image', 'jpa.test.flavor',
                                      'jpa.container.cli', 'jpa.require', 'jpa.test.logging']

    // Exclude @Tag("perf") tests from normal builds — run via perfTest task
    test {
        useJUnitPlatform {
            excludeTags 'perf'
        }
        backendSelectionProperties.each { key ->
            if (System.getProperty(key) != null) {
                systemProperty key, System.getProperty(key)
            }
        }
    }

    // Dedicated task for performance and thread-safety tests (@Tag("perf"))
    tasks.register('perfTest', Test) {
        useJUnitPlatform {
            includeTags 'perf'
        }
        maxHeapSize = '2g'
        // Don't fail the build on perf test failures — results are informational
        ignoreFailures = true
    }
    
       // Add JUnit dependencies for modules that have Gradle tests
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.4'
        testImplementation 'org.mockito:mockito-core:5.23.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }
    
}

// Sonar setup
sonarqube {
  properties {
    property "sonar.projectName", "emf.persistence-jpa"
    property "sonar.projectKey", "eclipse-fennec_emf.peristence-jpa"
    property "sonar.organization", "eclipse-fennec"
    property "sonar.host.url", "https://sonarcloud.io"
    property "sonar.coverage.jacoco.xmlReportPaths", "${rootDir}/build/reports/jacoco/codeCoverageReport/codeCoverageReport.xml"
    //property "sonar.exclusions", "org.eclipse.fennec.project/**/*.java"
  }
}

task codeCoverageReport(type: JacocoReport) {
    dependsOn(test)
    // Gather execution data from all subprojects for JUnit generated/jacoco/test.exec for OSGi Tests generated/tmp/testOSGi/generated/jacoco.exec
    // Latter are generated via agent in the test.bndrun
    executionData fileTree(project.rootDir.absolutePath).include("**/**/*.exec")

    // Add all relevant sourcesets from the subprojects
    subprojects.each {
        sourceSets it.sourceSets.main
    }

    // Generate xml reports for tools like sonar and html for humans
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named("sonar") {
    dependsOn(codeCoverageReport)
}

